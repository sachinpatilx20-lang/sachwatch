<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sach — Premium Links & Cinematic watchlist</title>
    <meta name="description"
        content="A pristine, minimalist link library and cinematic watchlist. Save links, track movies, and sync peer-to-peer.">
    <!-- Clean Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Icons and Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- P2P and QR Code Libraries -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="dark-theme">

    <!-- Loading Overlay -->
    <div id="loader" class="modal-overlay hidden" style="background: rgba(9,11,17,0.95); z-index: 9999;">
        <div style="text-align: center; color: var(--text-primary);">
            <div class="loader-spinner"
                style="border: 4px solid var(--border-color); border-top: 4px solid var(--accent-color); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin: 0 auto 1.5rem;">
            </div>
            <p id="loader-text"
                style="font-family: var(--font-heading); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px;">
                Fetching metadata...</p>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Sticky Header -->
    <header>
        <div class="nav-container">
            <!-- Brand Logo -->
            <div class="logo" id="logoHome">
                <i class="fa-solid fa-play"></i>
                <span></span>
            </div>

            <!-- Smart Search (Unified local + IMDb suggestions) -->
            <div class="header-search">
                <div class="search-input-wrapper">
                    <i class="fas fa-search search-icon-inside"></i>
                    <input type="text" id="searchInput" placeholder="Search movies, TV shows, or paste URL..."
                        autocomplete="off">
                    <button id="searchClearBtn" class="search-clear-btn hidden" title="Clear">×</button>
                </div>
                <!-- Search Suggestions Dropdown -->
                <div id="search-dropdown" class="results-dropdown hidden"></div>
            </div>

            <!-- Desktop Navigation Links -->
            <nav class="nav-links">
                <button class="nav-btn active" data-tab="library"><i class="fas fa-folder-open"></i>My List</button>
                <button class="nav-btn" data-tab="sync"><i class="fas fa-tv"></i>Sync Devices</button>
            </nav>

            <!-- Desktop Theme & Actions -->
            <div class="header-actions">
                <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                    <i class="fas fa-sun" id="themeIcon"></i>
                </button>
            </div>

            <!-- Mobile Search Icon -->
            <div class="mobile-search-toggle" id="mobile-search-btn" style="cursor: pointer; display: none;">
                <i class="fas fa-search" style="font-size: 1.25rem;"></i>
            </div>
        </div>
    </header>

    <!-- App Container -->
    <main class="app-container">

        <!-- Library & History Sections -->
        <div id="library-history-container">

            <!-- Billboard Hero Banner (Injected dynamically) -->
            <div id="heroBannerContainer"></div>

            <!-- Unified Filters & Tag pills bar -->
            <div class="category-container">
                <!-- Tag Filters -->
                <div id="tagFilter" class="category-bar">
                    <button class="cat-pill active" data-tag="all">All Tags</button>
                </div>
            </div>

            <!-- Main Library Grid -->
            <div id="linkGrid" class="link-grid">
                <!-- Cards injected here dynamically -->
                <div class="empty-state">
                    <i class="fas fa-folder-open empty-state-icon"></i>
                    <div class="empty-title">Nothing here yet</div>
                    <div class="empty-sub">Paste a link above or search movies & TV shows to begin.</div>
                </div>
            </div>
        </div>

        <!-- Sync Section -->
        <section id="sync-section" class="hidden" style="margin-top: 1rem;">
            <div class="sync-grid">
                <!-- Sync Host code generator -->
                <div class="sync-card">
                    <p class="sync-label">Your Pairing Code</p>
                    <div id="sync-code-display" class="sync-code">——</div>
                    <div id="p2p-qr" class="p2p-qr hidden"></div>
                    <button id="generate-sync" class="btn primary" style="width:100%"><i
                            class="fas fa-broadcast-tower"></i> Generate Code</button>
                    <p class="sync-hint">Generate a code to broadcast your links and watchlist library to a secondary
                        device.</p>
                </div>

                <!-- Sync Guest pairing form -->
                <div class="sync-card">
                    <p class="sync-label">Pair with Code</p>
                    <input type="text" id="sync-input" class="sync-input" placeholder="Enter 6-digit code"
                        maxlength="6">
                    <button id="load-sync" class="btn secondary" style="width:100%"><i class="fas fa-link"></i> Pair
                        Device</button>
                    <p class="sync-hint">Enter the 6-digit code from your primary device to merge both collections.</p>
                </div>
            </div>


        </section>
    </main>

    <!-- Mobile Navigation Tab Bar -->
    <nav class="tab-bar">
        <button class="tab-item active" data-tab="library"><i class="fas fa-folder-open"></i><span>My List</span></button>
        <button class="tab-item" data-tab="sync"><i class="fas fa-tv"></i><span>Sync Devices</span></button>
    </nav>

    <!-- Mobile Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-header">
            <button id="close-search"><i class="fas fa-arrow-left"></i></button>
            <input type="text" id="mobile-search-input" placeholder="Search movies, TV shows, or paste link..."
                autocomplete="off">
        </div>
        <div id="mobile-results" style="flex:1; overflow-y:auto; padding-bottom: 2rem;"></div>
    </div>

    <!-- Hidden Inputs for App Ingestion logic -->
    <input type="url" id="urlInput" style="display: none;">
    <input type="text" id="addTagsInput" style="display: none;">
    <button id="addBtn" style="display: none;"></button>

    <!-- Details Modal (Unified Movie watchlist + Link quick view) -->
    <div class="modal-overlay hidden" id="main-modal">
        <div class="modal-content">
            <!-- Poster Side -->
            <div class="modal-poster-side">
                <img id="modal-img" src="" alt="Poster"
                    onerror="this.onerror=null; this.src='https://via.placeholder.com/300x450?text=Poster+Unavailable'">
            </div>
            <!-- Info Side -->
            <div class="modal-info-side">
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-desc" class="modal-meta"></div>

                <!-- Web Link actions -->
                <div id="modal-link-actions" class="modal-link-actions hidden">
                    <button id="modal-open-url" class="btn secondary" style="flex: 1;"><i
                            class="fas fa-external-link-alt"></i> Open</button>
                    <button id="modal-copy-url" class="btn secondary" style="flex: 1;"><i class="fas fa-copy"></i> Copy
                        Link</button>
                    <button id="modal-edit-toggle" class="btn secondary" title="Edit Properties"><i
                            class="fas fa-pen"></i> Edit</button>
                </div>

                <!-- Web Link inline details editor -->
                <div id="modal-edit-section" class="modal-edit-section hidden">
                    <div class="modal-edit-field">
                        <label>Title</label>
                        <input type="text" id="modal-edit-title" placeholder="Title">
                    </div>
                    <div class="modal-edit-field">
                        <label>Description / Actors</label>
                        <input type="text" id="modal-edit-desc" placeholder="Details">
                    </div>
                    <button id="modal-edit-save" class="btn primary" style="width:100%; margin-top: 6px;">Save
                        Changes</button>
                </div>

                <!-- Actors / Tags Editor -->
                <div id="modal-actors-section" class="modal-actors-section">
                    <label id="modal-tags-label">Actors</label>
                    <div id="modal-actor-tags" class="modal-actor-tags"></div>
                    <div class="modal-actor-input-wrap">
                        <input type="text" id="modal-actor-input" placeholder="Add tags...">
                        <button id="modal-add-actor" class="btn primary icon-btn-sm"
                            style="width: 32px; height: 32px; border-radius: 8px;"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <!-- Dialog actions (Add, watched, delete) -->
                <div class="modal-actions">
                    <div class="modal-actions-row" style="grid-template-columns: 1fr;">
                        <button id="add-to-library" class="btn primary">Add to My List</button>
                    </div>
                    <button id="close-modal" class="btn secondary">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script src="app.js"></script>
</body>

</html>
