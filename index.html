<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sach.in | Movie series</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>

<body>
    <!-- Desktop Header -->
    <header>
        <nav class="nav-container">
            <div class="logo">Sach.in</div>

            <div class="search-box">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="main-search" placeholder="Search movies & shows...">
                <div id="desktop-search-results" class="glass-dropdown hidden"></div>
            </div>

            <div class="nav-links">
                <button class="nav-btn active" data-tab="vault"><i class="fas fa-layer-group"></i> Vault</button>
                <button class="nav-btn" data-tab="history"><i class="fas fa-history"></i> History</button>
                <button class="nav-btn" data-tab="sync"><i class="fas fa-sync"></i> Sync</button>
            </div>

            <div class="mobile-search-trigger" id="open-mobile-search">
                <i class="fas fa-search"></i>
            </div>
        </nav>
    </header>

    <main class="container">
        <!-- Vault Section -->
        <section id="vault-section">
            <h1 class="section-title">Watchlist</h1>
            <div id="watchlist-grid" class="movie-grid"></div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="hidden">
            <h1 class="section-title">Watched</h1>
            <div id="history-grid" class="movie-grid"></div>
        </section>

        <!-- Sync Section -->
        <section id="sync-section" class="hidden">
            <h1 class="section-title">Synchronization</h1>
            <div class="movie-grid" style="grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem;">
                <div style="background:var(--bg-sec); padding:2.5rem; border-radius:32px; text-align:center;">
                    <h3>Cloud Sync</h3>
                    <div id="sync-code-display"
                        style="font-size:3rem; font-weight:800; margin:1.5rem 0; letter-spacing:4px;">------</div>
                    <button id="generate-sync" class="btn-primary">Generate 6-Digit Code</button>
                </div>
                <div style="background:var(--bg-sec); padding:2.5rem; border-radius:32px; text-align:center;">
                    <h3>Import Data</h3>
                    <input type="text" id="sync-input" placeholder="Enter code"
                        style="width:100%; padding:1rem; border-radius:16px; border:none; margin-bottom:1rem; outline:none; text-align:center; font-size:1.2rem; font-weight:700;">
                    <button id="load-sync" class="btn-sec">Load from Code</button>
                </div>
                <div style="background:var(--bg-sec); padding:2.5rem; border-radius:32px; text-align:center;">
                    <h3>Direct P2P</h3>
                    <button id="start-p2p" class="btn-primary">Start Direct Share</button>
                    <div id="p2p-share-view" class="hidden">
                        <div id="p2p-qrcode"
                            style="margin:1.5rem auto; padding:1rem; background:white; border-radius:24px; width:fit-content;">
                        </div>
                        <p id="p2p-my-id" style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1.5rem;"></p>
                        <button id="copy-share-link" class="btn-sec" style="margin-bottom:0.5rem">Copy Share
                            Link</button>
                        <button id="stop-p2p" class="btn-sec">Cancel Sharing</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Mobile Bottom Tab Bar -->
    <nav class="mobile-nav">
        <button class="mobile-tab active" data-tab="vault">
            <i class="fas fa-layer-group"></i>
            <span>Watchlist</span>
        </button>
        <button class="mobile-tab" data-tab="history">
            <i class="fas fa-history"></i>
            <span>Watched</span>
        </button>
        <button class="mobile-tab" data-tab="sync">
            <i class="fas fa-sync"></i>
            <span>Sync</span>
        </button>
    </nav>

    <!-- Mobile Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-header">
            <button id="close-mobile-search" style="background:none; border:none; font-size:1.2rem;"><i
                    class="fas fa-arrow-left"></i></button>
            <input type="text" id="mobile-search-input" placeholder="Search movies...">
        </div>
        <div id="mobile-search-results" style="padding:1rem; overflow-y:auto; flex:1;"></div>
    </div>

    <!-- Universal Modal -->
    <div class="modal-overlay" id="universal-modal">
        <div class="modal-content">
            <img id="modal-img" class="modal-poster" src="">
            <div class="modal-info">
                <h2 id="modal-title"></h2>
                <div style="display:flex; flex-direction:column; gap:1rem;">
                    <button id="modal-add-btn" class="btn-primary">Add to Watchlist</button>
                    <button id="modal-watched-btn" class="btn-sec">Mark as Watched</button>
                    <button id="modal-close" class="btn-sec">Close Details</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
