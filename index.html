<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sach.in | Cinematic Collection</title>
    <meta name="description" content="A minimalistic, high-performance movie watchlist and P2P sharing platform.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>

<body>
    <header>
        <div class="nav-container">
            <div class="logo">Sach<span>.in</span></div>

            <div class="search-wrap">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="main-search" placeholder="Search movies or series...">
                <div id="search-dropdown" class="results-dropdown hidden"></div>
            </div>

            <div class="nav-links">
                <button class="nav-btn active" data-tab="vault"><i class="fas fa-layer-group"></i>Watchlist</button>
                <button class="nav-btn" data-tab="history"><i class="fas fa-check-circle"></i>Finished</button>
                <button class="nav-btn" data-tab="sync"><i class="fas fa-broadcast-tower"></i>Connect</button>
            </div>

            <div class="mobile-search-toggle" id="mobile-search-btn">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Vault Section -->
        <section id="vault-section">
            <div class="section-header">

            </div>
            <div id="watchlist-grid" class="movie-grid"></div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="hidden">
            <div class="section-header">

            </div>
            <div id="history-grid" class="movie-grid"></div>
        </section>

        <!-- Sync Section -->
        <section id="sync-section" class="hidden">
            <div class="section-header">

            </div>
            <div class="sync-grid">
                <div class="sync-card">
                    <p class="sync-label">Your Share Code</p>
                    <div id="sync-code-display" class="sync-code">——</div>
                    <button id="generate-sync" class="btn-prime" style="width:100%">Generate Code</button>
                    <p class="sync-hint">Share this code with another device to transfer your collection.</p>
                </div>

                <div class="sync-card">
                    <p class="sync-label">Import Collection</p>
                    <input type="text" id="sync-input" class="sync-input" placeholder="Enter 6-digit code"
                        maxlength="6">
                    <button id="load-sync" class="btn-ghost" style="width:100%">Import Now</button>
                    <p class="sync-hint">Enter the share code from another device to import their collection.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Mobile Navigation -->
    <nav class="tab-bar">
        <button class="tab-item active" data-tab="vault"><i
                class="fas fa-layer-group"></i><span>Watchlist</span></button>
        <button class="tab-item" data-tab="history"><i class="fas fa-check-circle"></i><span>Finished</span></button>
        <button class="tab-item" data-tab="sync"><i class="fas fa-broadcast-tower"></i><span>Connect</span></button>
    </nav>

    <!-- Mobile Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-header">
            <button id="close-search"><i class="fas fa-arrow-left"></i></button>
            <input type="text" id="mobile-search-input" placeholder="Search movies...">
        </div>
        <div id="mobile-results" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="main-modal">
        <div class="modal-content">
            <div class="modal-poster-side">
                <img id="modal-img" src="" alt="Poster">
            </div>
            <div class="modal-info-side">
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-desc" class="modal-meta"></div>
                <div class="modal-actions">
                    <button id="add-to-vault" class="btn-prime">Add</button>
                    <button id="mark-watched" class="btn-ghost">Mark as Finished</button>
                    <button id="close-modal" class="btn-ghost">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
