<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SachWatch | Cinematic Collection</title>
    <meta name="description" content="A minimalistic, high-performance movie watchlist and P2P sharing platform.">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>

<body>
    <header>
        <div class="nav-container">
            <div class="logo">Sach<span>Watch</span></div>

            <div class="search-wrap">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="main-search" placeholder="Search movies, TV shows, or paste URL...">
                <div id="search-dropdown" class="results-dropdown hidden"></div>
            </div>

            <div class="nav-links">
                <button class="nav-btn active" data-tab="vault"><i class="fas fa-play"></i>My List</button>
                <button class="nav-btn" data-tab="history"><i class="fas fa-history"></i>Completed</button>
                <button class="nav-btn" data-tab="sync"><i class="fas fa-tv"></i>Pair Devices</button>
            </div>

            <div class="mobile-search-toggle" id="mobile-search-btn">
                <i class="fas fa-search"></i>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Vault Section -->
        <section id="vault-section">
            <div id="hero-banner" class="hero-banner hidden"></div>
            <div id="watchlist-grid" class="movie-grid"></div>
        </section>

        <!-- History Section -->
        <section id="history-section" class="hidden">
            <div class="section-header">

            </div>
            <div id="history-grid" class="movie-grid"></div>
        </section>

        <!-- Sync Section -->
        <section id="sync-section" class="hidden">
            <div class="section-header">

            </div>
            <div class="sync-grid">
                <div class="sync-card">
                    <p class="sync-label">Your Pairing Code</p>
                    <div id="sync-code-display" class="sync-code">——</div>
                    <div id="p2p-qr" class="p2p-qr hidden"></div>
                    <button id="generate-sync" class="btn-prime" style="width:100%">Generate Code</button>
                    <p class="sync-hint">Use this code to pair another device and sync your library.</p>
                </div>

                <div class="sync-card">
                    <p class="sync-label">Pair with Code</p>
                    <input type="text" id="sync-input" class="sync-input" placeholder="Enter 6-digit code"
                        maxlength="6">
                    <button id="load-sync" class="btn-ghost" style="width:100%">Pair Device</button>
                    <p class="sync-hint">Enter the 6-digit code from your secondary device to sync libraries.</p>
                </div>
            </div>
        </section>
    </main>

    <!-- Mobile Navigation -->
    <nav class="tab-bar">
        <button class="tab-item active" data-tab="vault"><i class="fas fa-play"></i><span>My List</span></button>
        <button class="tab-item" data-tab="history"><i class="fas fa-history"></i><span>Completed</span></button>
        <button class="tab-item" data-tab="sync"><i class="fas fa-tv"></i><span>Pair Devices</span></button>
    </nav>

    <!-- Mobile Search Overlay -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-header">
            <button id="close-search"><i class="fas fa-arrow-left"></i></button>
            <input type="text" id="mobile-search-input" placeholder="Search movies...">
        </div>
        <div id="mobile-results" style="flex:1; overflow-y:auto;"></div>
    </div>

    <!-- Link Input Overlay -->
    <div class="link-overlay" id="link-overlay">
        <div class="link-overlay-content">
            <div class="link-overlay-header">
                <h3>Import Movie from URL</h3>
                <button id="close-link-overlay"><i class="fas fa-times"></i></button>
            </div>
            <div id="link-loading" class="link-loading hidden">
                <div class="link-spinner"></div>
                <span>Extracting metadata...</span>
            </div>
            <!-- Preview & Thumbnail Picker (shown after fetch) -->
            <div id="link-preview" class="link-preview hidden">
                <div class="link-preview-meta">
                    <h4 id="link-preview-title"></h4>
                    <p id="link-preview-desc"></p>
                </div>
                <p id="link-thumb-status" class="link-thumb-status">Select a thumbnail:</p>
                <div id="link-thumb-picker" class="link-thumb-picker"></div>
                <button id="link-confirm-btn" class="btn-prime" style="width:100%; margin-top:1rem;">Add</button>
            </div>
        </div>
    </div>

    <!-- Details Modal -->
    <div class="modal-overlay" id="main-modal">
        <div class="modal-content">
            <div class="modal-poster-side">
                <img id="modal-img" src="" alt="Poster">
            </div>
            <div class="modal-info-side">
                <!-- Standard view -->
                <h2 id="modal-title" class="modal-title"></h2>
                <div id="modal-desc" class="modal-meta"></div>

                <!-- Link-specific: URL actions -->
                <div id="modal-link-actions" class="modal-link-actions hidden">
                    <button id="modal-copy-url" class="btn-icon" title="Copy URL"><i class="fas fa-copy"></i></button>
                    <button id="modal-open-url" class="btn-icon" title="Open URL"><i
                            class="fas fa-external-link-alt"></i></button>
                    <button id="modal-edit-toggle" class="btn-icon" title="Edit"><i class="fas fa-pen"></i></button>
                </div>

                <!-- Link-specific: Edit section (hidden by default) -->
                <div id="modal-edit-section" class="modal-edit-section hidden">
                    <div class="modal-edit-field">
                        <label>Title</label>
                        <input type="text" id="modal-edit-title" placeholder="Title">
                    </div>
                    <div class="modal-edit-field">
                        <label>Description</label>
                        <input type="text" id="modal-edit-desc" placeholder="Description">
                    </div>
                    <button id="modal-edit-save" class="btn-prime" style="width:100%">Save Changes</button>
                </div>

                <!-- Link-specific: Actor tags -->
                <div id="modal-actors-section" class="modal-actors-section hidden">
                    <label>Actors</label>
                    <div id="modal-actor-tags" class="modal-actor-tags"></div>
                    <div class="modal-actor-input-wrap">
                        <input type="text" id="modal-actor-input" placeholder="Add actor name...">
                        <button id="modal-add-actor" class="btn-icon-sm"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <div class="modal-actions">
                    <button id="add-to-vault" class="btn-prime">Add to My List</button>
                    <button id="mark-watched" class="btn-ghost">Mark Completed</button>
                    <button id="close-modal" class="btn-ghost">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
